<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Weather Dashboard</h1>
    </header>
    
    <main>
        <section id="search-container">
            <input type="text" id="location-input" placeholder="Enter city name or zip code">
            <button id="search-button">Search</button>
            <button id="use-location-button">Use My Location</button>
        </section>
        
        <section id="current-weather-container">
            <h2>Current Weather</h2>
            <div id="current-weather-data">
                <!-- Weather data will be displayed here by app.js -->
            </div>
        </section>
        
        <section id="forecast-container">
            <h2>24-Hour Forecast</h2>
            <div id="forecast-data">
                <!-- Forecast data will be displayed here by app.js -->
            </div>
        </section>
    </main>
    
    <footer>
        <p>Weather data provided by OpenWeatherMap</p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
